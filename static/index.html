<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Piper TTS - Voice Testing Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 4px solid #28a745;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #28a745;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .form-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 1rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .voice-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            background: white;
        }

        .voice-option {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
        }

        .voice-option:hover {
            background: #e3f2fd;
            border-color: #4facfe;
        }

        .voice-option.selected {
            background: #4facfe;
            color: white;
            border-color: #4facfe;
        }

        .voice-option input[type="radio"] {
            margin-right: 8px;
        }

        .voice-label {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .language-badge {
            display: inline-block;
            background: #6c757d;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 3px;
            margin-left: 8px;
            font-weight: 500;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            min-width: 140px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .loading-spinner {
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-section {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }

        .result-section.success {
            border-color: #28a745;
            background: #f8fff9;
        }

        .result-section.error {
            border-color: #dc3545;
            background: #fff8f8;
        }

        .audio-player {
            width: 100%;
            margin: 20px 0;
            border-radius: 8px;
            background: #f8f9fa;
            padding: 10px;
        }

        .audio-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .audio-meta {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            color: #6c757d;
        }

        .search-box {
            margin-bottom: 15px;
        }

        .voice-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #6c757d;
        }

        .example-texts {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .example-btn {
            padding: 6px 12px;
            border: 1px solid #dee2e6;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .example-btn:hover {
            background: #e3f2fd;
            border-color: #4facfe;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid;
        }

        .alert-error {
            background: #fff8f8;
            color: #721c24;
            border-left-color: #dc3545;
        }

        .alert-success {
            background: #f8fff9;
            color: #155724;
            border-left-color: #28a745;
        }

        .alert-info {
            background: #e3f2fd;
            color: #0c5460;
            border-left-color: #17a2b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ Binary Piper TTS</h1>
            <p>High-Quality Text-to-Speech Testing Interface</p>
        </div>

        <div class="content">
            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Checking service status...</span>
                </div>
                <div class="voice-stats">
                    <span id="voiceCount">Loading voices...</span>
                    <span id="languageCount">Detecting languages...</span>
                </div>
            </div>

            <!-- Alert Section -->
            <div id="alertSection"></div>

            <!-- Main Form -->
            <div class="form-section">
                <div class="form-group">
                    <label for="textInput">Text to Synthesize</label>
                    <textarea 
                        id="textInput" 
                        class="form-control" 
                        placeholder="Enter the text you want to convert to speech..."
                        rows="4">Hello world! This is a test of the Binary Piper text-to-speech system. The voice quality is excellent across all supported languages.</textarea>
                    
                    <div class="example-texts">
                        <span style="font-size: 0.85rem; color: #6c757d; margin-right: 10px;">Quick examples:</span>
                        <button class="example-btn" onclick="setExampleText('en')">English</button>
                        <button class="example-btn" onclick="setExampleText('es')">Español</button>
                        <button class="example-btn" onclick="setExampleText('fr')">Français</button>
                        <button class="example-btn" onclick="setExampleText('de')">Deutsch</button>
                        <button class="example-btn" onclick="setExampleText('zh')">中文</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="voiceSearch">Voice Selection</label>
                    <input 
                        type="text" 
                        id="voiceSearch" 
                        class="form-control search-box" 
                        placeholder="Search voices by name or language (e.g., 'english', 'spanish', 'female')..."
                        oninput="filterVoices()">
                    
                    <div class="voice-grid" id="voiceGrid">
                        <div style="text-align: center; color: #6c757d; grid-column: 1 / -1;">
                            Loading voices...
                        </div>
                    </div>
                </div>

                <div style="text-align: center; margin-top: 30px;">
                    <button id="synthesizeBtn" class="btn btn-primary" onclick="synthesizeText()">
                        <span id="synthesizeBtnText">🎵 Generate Speech</span>
                        <div id="synthesizeSpinner" class="loading-spinner" style="display: none;"></div>
                    </button>
                    
                    <button class="btn btn-secondary" onclick="clearResults()" style="margin-left: 15px;">
                        🗑️ Clear Results
                    </button>
                </div>
            </div>

            <!-- Results Section -->
            <div id="resultSection" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Global variables
        let voices = [];
        let filteredVoices = [];
        let serviceStatus = false;

        // Example texts in different languages
        const exampleTexts = {
            'en': 'Hello world! This is a demonstration of high-quality text-to-speech synthesis using Binary Piper.',
            'es': '¡Hola mundo! Esta es una demostración de síntesis de voz de alta calidad usando Binary Piper.',
            'fr': 'Bonjour le monde! Ceci est une démonstration de synthèse vocale de haute qualité utilisant Binary Piper.',
            'de': 'Hallo Welt! Dies ist eine Demonstration der hochwertigen Sprachsynthese mit Binary Piper.',
            'zh': '你好世界！这是使用Binary Piper进行高质量语音合成的演示。',
            'ru': 'Привет мир! Это демонстрация высококачественного синтеза речи с использованием Binary Piper.',
            'it': 'Ciao mondo! Questa è una dimostrazione della sintesi vocale di alta qualità usando Binary Piper.',
            'pt': 'Olá mundo! Esta é uma demonstração de síntese de voz de alta qualidade usando Binary Piper.',
            'ar': 'مرحبا بالعالم! هذا عرض توضيحي لتقنية تحويل النص إلى كلام عالية الجودة باستخدام Binary Piper.',
            'ja': 'こんにちは世界！これはBinary Piperを使用した高品質音声合成のデモンストレーションです。'
        };

        // Initialize the application
        async function init() {
            await checkServiceHealth();
            await loadVoices();
        }

        // Check service health
        async function checkServiceHealth() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                
                if (response.ok && data.status === 'healthy') {
                    serviceStatus = true;
                    updateStatus('✅ Service Online', 'success');
                } else {
                    serviceStatus = false;
                    updateStatus('❌ Service Unhealthy', 'error');
                    showAlert('Service is not healthy. Some features may not work properly.', 'error');
                }
            } catch (error) {
                serviceStatus = false;
                updateStatus('🔌 Connection Failed', 'error');
                showAlert('Cannot connect to TTS service. Please ensure the service is running on port 8000.', 'error');
            }
        }

        // Load available voices
        async function loadVoices() {
            if (!serviceStatus) return;

            try {
                const response = await fetch('/voices');
                voices = await response.json();
                filteredVoices = [...voices];
                
                updateVoiceStats();
                renderVoices();
                
                // Pre-select first English voice if available
                const defaultVoice = voices.find(v => v.startsWith('en_US')) || voices[0];
                if (defaultVoice) {
                    document.querySelector(`input[value="${defaultVoice}"]`).checked = true;
                }
                
            } catch (error) {
                showAlert('Failed to load voices: ' + error.message, 'error');
            }
        }

        // Update service status
        function updateStatus(text, type) {
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');
            
            statusText.textContent = text;
            statusDot.style.background = type === 'success' ? '#28a745' : '#dc3545';
        }

        // Update voice statistics
        function updateVoiceStats() {
            const voiceCount = document.getElementById('voiceCount');
            const languageCount = document.getElementById('languageCount');
            
            const languages = new Set(voices.map(v => v.split('_')[0] || v.split('-')[0]));
            
            voiceCount.textContent = `${voices.length} voices`;
            languageCount.textContent = `${languages.size} languages`;
        }

        // Render voice options
        function renderVoices() {
            const voiceGrid = document.getElementById('voiceGrid');
            
            if (filteredVoices.length === 0) {
                voiceGrid.innerHTML = '<div style="text-align: center; color: #6c757d; grid-column: 1 / -1;">No voices found matching your search.</div>';
                return;
            }
            
            voiceGrid.innerHTML = filteredVoices.map(voice => {
                const lang = voice.split('_')[0] || voice.split('-')[0];
                const quality = voice.includes('-high') ? 'HIGH' : voice.includes('-medium') ? 'MED' : 'LOW';
                
                return `
                    <div class="voice-option" onclick="selectVoice('${voice}')">
                        <input type="radio" name="voice" value="${voice}" id="voice_${voice}">
                        <label for="voice_${voice}" class="voice-label">
                            ${voice}
                            <span class="language-badge">${lang.toUpperCase()}</span>
                        </label>
                    </div>
                `;
            }).join('');
        }

        // Filter voices based on search
        function filterVoices() {
            const searchTerm = document.getElementById('voiceSearch').value.toLowerCase();
            
            if (!searchTerm) {
                filteredVoices = [...voices];
            } else {
                filteredVoices = voices.filter(voice => 
                    voice.toLowerCase().includes(searchTerm) ||
                    voice.split('_')[0].toLowerCase().includes(searchTerm)
                );
            }
            
            renderVoices();
        }

        // Select a voice
        function selectVoice(voiceName) {
            document.querySelector(`input[value="${voiceName}"]`).checked = true;
            
            // Update UI to show selection
            document.querySelectorAll('.voice-option').forEach(option => {
                option.classList.remove('selected');
            });
            document.querySelector(`input[value="${voiceName}"]`).closest('.voice-option').classList.add('selected');
        }

        // Set example text
        function setExampleText(lang) {
            const textInput = document.getElementById('textInput');
            textInput.value = exampleTexts[lang] || exampleTexts['en'];
        }

        // Show alert message
        function showAlert(message, type) {
            const alertSection = document.getElementById('alertSection');
            const alertClass = `alert-${type}`;
            
            alertSection.innerHTML = `
                <div class="alert ${alertClass}">
                    ${message}
                </div>
            `;
            
            // Auto-hide success alerts after 5 seconds
            if (type === 'success') {
                setTimeout(() => {
                    alertSection.innerHTML = '';
                }, 5000);
            }
        }

        // Main synthesis function
        async function synthesizeText() {
            const textInput = document.getElementById('textInput');
            const selectedVoice = document.querySelector('input[name="voice"]:checked');
            const synthesizeBtn = document.getElementById('synthesizeBtn');
            const synthesizeBtnText = document.getElementById('synthesizeBtnText');
            const synthesizeSpinner = document.getElementById('synthesizeSpinner');
            
            // Validation
            if (!textInput.value.trim()) {
                showAlert('Please enter some text to synthesize.', 'error');
                return;
            }
            
            if (!selectedVoice) {
                showAlert('Please select a voice.', 'error');
                return;
            }
            
            if (!serviceStatus) {
                showAlert('TTS service is not available.', 'error');
                return;
            }
            
            // Update UI for loading state
            synthesizeBtn.disabled = true;
            synthesizeBtnText.style.display = 'none';
            synthesizeSpinner.style.display = 'inline-block';
            
            try {
                const startTime = Date.now();
                
                const response = await fetch('/synthesize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: textInput.value.trim(),
                        voice: selectedVoice.value
                    })
                });
                
                const endTime = Date.now();
                const duration = endTime - startTime;
                
                if (response.ok) {
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    showResults({
                        success: true,
                        audioUrl: audioUrl,
                        voice: selectedVoice.value,
                        text: textInput.value.trim(),
                        duration: duration,
                        size: audioBlob.size
                    });
                    
                    showAlert('✅ Speech synthesis completed successfully!', 'success');
                } else {
                    const errorData = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorData}`);
                }
                
            } catch (error) {
                showResults({
                    success: false,
                    error: error.message
                });
                
                showAlert('❌ Synthesis failed: ' + error.message, 'error');
            } finally {
                // Reset UI
                synthesizeBtn.disabled = false;
                synthesizeBtnText.style.display = 'inline';
                synthesizeSpinner.style.display = 'none';
            }
        }

        // Show synthesis results
        function showResults(result) {
            const resultSection = document.getElementById('resultSection');
            
            if (result.success) {
                resultSection.className = 'result-section success';
                resultSection.innerHTML = `
                    <h3 style="color: #28a745; margin-bottom: 20px;">🎉 Synthesis Successful!</h3>
                    
                    <div class="audio-info">
                        <div>
                            <strong>Voice:</strong> ${result.voice}<br>
                            <strong>Text Length:</strong> ${result.text.length} characters
                        </div>
                        <div class="audio-meta">
                            <span><strong>Size:</strong> ${(result.size / 1024).toFixed(1)} KB</span>
                            <span><strong>Time:</strong> ${result.duration} ms</span>
                            <span><strong>Format:</strong> WAV</span>
                        </div>
                    </div>
                    
                    <div>
                        <strong>Generated Text:</strong>
                        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 8px; font-style: italic;">
                            "${result.text}"
                        </div>
                    </div>
                    
                    <div style="margin-top: 20px;">
                        <audio controls class="audio-player" preload="metadata">
                            <source src="${result.audioUrl}" type="audio/wav">
                            Your browser does not support the audio element.
                        </audio>
                    </div>
                    
                    <div style="text-align: center; margin-top: 20px;">
                        <a href="${result.audioUrl}" download="tts_output.wav" class="btn btn-secondary">
                            💾 Download Audio
                        </a>
                    </div>
                `;
            } else {
                resultSection.className = 'result-section error';
                resultSection.innerHTML = `
                    <h3 style="color: #dc3545; margin-bottom: 20px;">❌ Synthesis Failed</h3>
                    <div style="background: #fff8f8; padding: 15px; border-radius: 8px; color: #721c24;">
                        <strong>Error:</strong> ${result.error}
                    </div>
                `;
            }
            
            resultSection.style.display = 'block';
        }

        // Clear results
        function clearResults() {
            const resultSection = document.getElementById('resultSection');
            resultSection.style.display = 'none';
            resultSection.innerHTML = '';
            
            // Clear any alerts
            document.getElementById('alertSection').innerHTML = '';
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
